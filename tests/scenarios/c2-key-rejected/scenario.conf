# shellcheck shell=bash disable=SC2034,SC2154  # read by tests/scenario.sh, which sets bench_tmp and results
# C2: the API rejects the stick's key (HTTP 401). It runs on a test-only ISO
# that build.sh builds with a deliberately invalid key piped in, into its own
# directory, so the shipping image carries no key override:
#
#   printf 'sk-%s' "$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')" \
#       | sudo ./build.sh --key-stdin --out-dir out/test-invalid-key
#
# With --key-record (a key-less image, such as a release's) the record past
# the image carries such a key instead (record_key=invalid). A key-less image
# treats it as a key typed at boot: tty1 says it was refused and asks for
# another, and the bench types a working one there.
#
# tty1 must say the key was rejected and how to fix it, and the agent must not
# start (no silent loop). Then the bench fixes it as the owner would, over
# SSH: it pipes a working key into the key file and restarts rescue-proxy,
# and the agent must start by itself.
description="The API rejects the key: tty1 says how to fix it"
bases=(arch-sdboot)
diagnosis=''
outcome=''
owner=no
unchanged=disk
log_on_disk=0
iso_dir=test-invalid-key
record_key=invalid
screen='THE API KEY WAS REJECTED \(http 401\)'
[[ -z ${key_record:-} ]] || screen='refused that key \(http 401\)'
live_check() {  # the fix is on screen, and following it starts the agent
    local key=$bench_tmp/live-key
    if [[ -n ${key_record:-} ]]; then
        rescue_screen "$1" 'Type or paste another one' || { echo "tty1 does not ask for another key"; return 1; }
        bench_key "$key"
        [[ -s $key ]] || { echo "no working key to fix it with"; return 1; }
        rescue_type_key "$1" "$results/rescue-serial.log" "$key" 60 \
            || { rm -f "$key"; echo "could not type the key at tty1's prompt"; return 1; }
    else
        if ! { rescue_screen "$1" 'systemctl restart rescue-proxy' && rescue_screen "$1" '/run/.rescue-key/deepseek-key'; }; then
            echo "tty1 does not say how to fix the key"; return 1
        fi
        bench_key "$key"
        [[ -s $key ]] || { echo "no working key to fix it with"; return 1; }
        rescue_ssh "$1" 'umask 077; cat > /run/.rescue-key/deepseek-key && systemctl restart rescue-proxy' < "$key" \
            || { rm -f "$key"; echo "could not replace the key over SSH"; return 1; }
    fi
    rm -f "$key"
    # shellcheck disable=SC2016  # expands on the rescue system
    BENCH_STALL_RETRIES=0 wait_for "$results/rescue-serial.log" 120 rescue_ssh "$1" 'pgrep -f "[o]pencode --standalone" > /dev/null' \
        || { echo "the agent did not start within 120 s of the key's fix"; return 1; }
    echo "tty1 says how to fix the key; with a working key the agent started by itself"
}
