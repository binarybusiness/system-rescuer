# shellcheck shell=bash disable=SC2034,SC2154  # read by tests/scenario.sh, which sets results and rescue_monitor
# C9: a phone's USB tethering is the only way out. It runs on C6's test-only
# ISO, whose wired NICs never ask for an address but which leaves the
# shipping DHCP on for any other wired NIC, as a phone's is:
#
#   sudo ./build.sh --out-dir out/test-no-dhcp --overlay tests/bench/no-dhcp-overlay
#
# tty1 must show the network menu; the stand-in owner chooses USB tethering,
# then "plugs the phone in": the bench adds qemu's usb-net (an RNDIS and CDC
# Ethernet device) on its own network, 10.0.4.0/24, through the monitor. The
# menu must close by itself once the phone's DHCP gives a route, and the agent
# must then start by itself and finish the rescue: the deleted initramfs
# rebuilt.
description="USB tethering: the owner plugs a phone in at tty1's menu, and the agent starts"
bases=(arch-sdboot)
diagnosis='initramfs|initrd'
outcome=repaired
owner=ok
net=tether
iso_dir=test-no-dhcp
tty1_shows='DeepSeek|Questions'
owner_network() {  # as the owner at tty1: the menu's USB tethering, then the phone
    local p=$1 link device driver
    wait_for "$results/rescue-serial.log" 300 rescue_screen "$p" 'NO NETWORK: no address came from the network' \
        || { echo "tty1 showed no network menu within 300 s"; return 1; }
    rescue_tmux "$p" send-keys -t rescue 1 Enter || return 1
    wait_for "$results/rescue-serial.log" 30 rescue_screen "$p" 'Connect the phone with its USB cable' \
        || { echo "the menu never asked for the phone"; return 1; }
    printf 'device_add usb-net,netdev=phone,id=phone\n' | socat - UNIX-CONNECT:"$rescue_monitor" > /dev/null 2>&1 \
        || { echo "the monitor did not take the phone"; return 1; }
    wait_for "$results/rescue-serial.log" 90 rescue_screen "$p" 'rescue-network: the network is up' \
        || { echo "the phone was plugged in, but the menu saw no route: $(rescue_ssh "$p" 'ip -brief address; ip route' 2>&1 | tr '\n' ' ')"; return 1; }
    # The link that holds the phone's address must be a USB device: qemu's
    # usb-net binds cdc_subset, a phone rndis_host, cdc_ncm or cdc_ether.
    link=$(rescue_ssh "$p" ip -4 -o address show to 10.0.4.0/24 2>&1 | awk '{print $2; exit}')
    [[ -n $link ]] || { echo "the menu closed, but no link has the phone's address: $(rescue_ssh "$p" ip -4 -brief address 2>&1 | tr '\n' ' ')"; return 1; }
    device=$(rescue_ssh "$p" readlink -f "/sys/class/net/$link/device" 2>&1)
    driver=$(rescue_ssh "$p" readlink -f "/sys/class/net/$link/device/driver" 2>&1)
    [[ $device == */usb* ]] || { echo "the phone's address is on $link, which is not a USB device ($device)"; return 1; }
    link="$link (USB, ${driver##*/})"
    echo "tty1 showed the network menu; a phone's USB tethering plugged in from it brought the network up: $link"
}
