# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A8: fstab mounts an archive disk that is no longer attached, without
# nofail: the boot waits 90 s for it and ends in the emergency shell. The
# repair keeps the line and adds nofail, and the log says which disk is gone.
description="fstab names a detached data disk without nofail"
bases=(arch-sdboot)
diagnosis='fstab|archive|missing|nofail|timed out|not found|absent'
outcome=repaired
owner=ok
check() { fstab_keeps "$1" /srv/archive nofail; }
