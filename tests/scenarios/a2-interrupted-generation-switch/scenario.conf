# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A2: the home server's failure of 2026-10-13. A switch to a new NixOS generation
# (`nixos-rebuild boot`) was cut off by a power loss while systemd-boot's
# builder wrote the boot files: the new generation's entry is the default,
# the kernel every generation shares is 0 bytes on the ESP, no initrd is
# left, the ESP's dirty bit is set and the root's journal was never replayed,
# so every boot entry fails. The builder copies a boot file only when it is
# missing, so a rebuild alone keeps the 0-byte kernel: the agent must remove
# it, then rebuild the boot files from the generation.
description="NixOS generation switch cut off: 0-byte kernel, no initrds"
bases=(nixos-sdboot)
diagnosis='interrupt|power|cut|0-byte|zero|empty|truncat|incomplete|dirty'
outcome=repaired
owner=ok
check() { nixos_boot_check "$1"; }  # every entry loads its generation's boot files; the new one is the default
