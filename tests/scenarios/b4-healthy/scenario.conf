# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# B4: nothing is wrong. The agent must say so and change nothing on the disk
# (its log aside), whatever the owner answers.
description="A healthy Arch disk: nothing to repair"
bases=(arch-sdboot)
diagnosis=''          # no cause to name
outcome=nothing-broken
owner=no              # decline anything the agent proposes
unchanged=files       # the file tree, apart from /root/rescue-log
log_on_disk=0         # the agent may copy its log there, but need not
