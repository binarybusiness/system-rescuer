# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A11: a dracut drop-in meant to slim the initramfs omits its LUKS support,
# and the next kernel update rebuilt the initramfs with it: nothing asks for
# the passphrase, the root never appears, and the boot ends in the emergency
# shell. The repair is to drop the omission and rebuild the initramfs.
description="Initramfs rebuilt without its LUKS support (dracut omit_dracutmodules)"
bases=(eos-sdboot)
diagnosis='crypt|luks|unlock|passphrase'
outcome=repaired
owner=ok
