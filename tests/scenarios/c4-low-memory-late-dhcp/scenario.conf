# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# C4: a small machine on a slow network: 2 GiB of RAM, and the NIC's link
# down for the first 60 s, so DHCP answers only then. The stick must still
# boot, start the agent (its status line naming the model on tty1) and finish
# a repair that runs the package tools in RAM: the deleted initramfs rebuilt.
description="2 GiB of RAM and DHCP after 60 s: the stick still boots and repairs"
bases=(arch-sdboot)
diagnosis='initramfs|initrd'
outcome=repaired
owner=ok
rescue_mem=2048
net=late
tty1_shows='DeepSeek|Questions'
