# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# B6: a btrfs RAID1 data pool lost one of its two disks, and fstab mounts the
# pool without nofail: the boot waits for the missing member and ends in the
# emergency shell. The surviving member may be mounted read-only and degraded
# to look, never repaired (no btrfs check --repair, replace or balance): the
# bystander oracle checks it is unchanged, byte for byte. The repair lets the
# system boot without the pool (nofail) and tells the owner which disk to
# replace.
description="btrfs RAID1 data pool with a member missing, mounted without nofail"
bases=(arch-sdboot)
diagnosis='missing|degraded|raid|member'
outcome=repaired
owner=ok
check() { fstab_keeps "$1" /srv/pool nofail; }
