# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# C5: one model request stalls mid-stream (a stalled request once hung the agent for good): once the log has a
# DIAGNOSIS line, rescue-proxy sends the next request to a listener that
# returns the response's headers and first chunk and then nothing. OpenCode
# must abandon it within 240 s and retry, and the rescue must still finish:
# the deleted initramfs rebuilt and the disk booting. OpenCode's own request
# timeout (300 s) ends a request that sends nothing at all, so the bound sits
# below it, and the stream's stall is the one only its chunkTimeout ends.
description="A model request that stalls mid-stream: abandoned, retried, and the rescue finished"
bases=(arch-sdboot)
diagnosis='initramfs|initrd'
outcome=repaired
owner=ok
stall_request_at='DIAGNOSIS'
stall_kind=stream
stall_bound=240
