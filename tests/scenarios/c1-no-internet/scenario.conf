# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# C1: the rescue system has no way out to the internet (qemu's restrict=on:
# DHCP answers, nothing beyond it does; with no NIC at all the stick takes the
# same path, but the bench could not reach it over SSH to read tty1). The
# agent cannot reach its model, so it must not start; tty1 says in plain
# words that it needs the internet, the read-only survey runs anyway, and the
# disk is left as it was.
description="No internet connection: the agent waits, the survey runs"
bases=(arch-sdboot)
diagnosis=''
outcome=''
owner=no
unchanged=disk
log_on_disk=0
net=offline
screen='NO INTERNET CONNECTION: the repair agent cannot start yet'
live_check() {  # the survey ran, and the key check says why the agent waits
    local survey check
    survey=$(rescue_ssh "$1" 'wc -l < /run/rescue/survey.txt' 2>/dev/null) || { echo "no /run/rescue/survey.txt"; return 1; }
    (( survey > 10 )) || { echo "the survey has only $survey lines"; return 1; }
    check=$(rescue_ssh "$1" 'cat /run/rescue/keycheck' 2>/dev/null)
    [[ $check == *"FAIL no connection"* ]] || { echo "key check says: ${check:-nothing}"; return 1; }
    echo "survey of $survey lines; key check: ${check#* }"
}
