# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# C8: the model ends its turn early (once the agent said it would start and stopped): from the moment SSH answers,
# rescue-proxy answers the next two chat requests with a sentence and a stop,
# no tool call, as the home server's agent did on its first boot. Nothing but the
# rescue-carry-on plugin wakes the agent then, so without it the agent sits
# idle until the bench gives up; with it, each early stop is followed by a
# nudge, and the rescue must still finish: the deleted initramfs rebuilt and
# the disk booting.
description="A model that ends its turn without acting: nudged on, and the rescue finished"
bases=(arch-sdboot)
diagnosis='initramfs|initrd'
outcome=repaired
owner=ok
early_stops=2
