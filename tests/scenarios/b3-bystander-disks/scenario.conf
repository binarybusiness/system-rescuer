# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# B3: a broken disk (its initramfs deleted, so its boot entry fails) beside
# two disks no repair needs: a healthy btrfs RAID1 photo pool over two disks,
# in fstab with nofail, and a Windows data disk (NTFS, in no fstab). The
# agent rebuilds the initramfs and leaves both pool members and the NTFS disk
# byte for byte as they were (the bystander oracle).
description="Initramfs deleted, beside a btrfs RAID1 pool and an NTFS data disk"
bases=(arch-sdboot)
diagnosis='initramfs|initrd'
outcome=repaired
owner=ok
