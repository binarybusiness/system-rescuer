# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A9: the root ext4 is marked as having errors and two files claim the same
# blocks, so the boot-time fsck -a stops with "UNEXPECTED INCONSISTENCY" and
# the boot ends in the emergency shell. Repairing needs e2fsck without -p,
# which needs the owner's OK. With OK, the disk must boot afterwards; with no,
# the disk must be left as it was, byte for byte, and the outcome is declined.
description="Root ext4 marked with errors: multiply-claimed blocks"
bases=(arch-sdboot)
diagnosis='e2fsck|fsck|inconsisten|multiply|duplicate|error'
outcome=repaired
owner=ok
expect() {  # shellcheck disable=SC2154  # owner_answer is set by tests/scenario.sh
    if [[ $owner_answer == no ]]; then
        outcome=declined boots=0 unchanged=disk log_on_disk=0
    fi
}
