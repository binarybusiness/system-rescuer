# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# C3: the agent process dies in the middle of a rescue (the bench kills it
# with SIGKILL once its log has a DIAGNOSIS line). The session must restart
# it on its own session, told to pick up from /root/rescue-log, say so on
# tty1, and the rescue must still finish: the deleted initramfs rebuilt and
# the disk booting.
description="The agent killed mid-rescue: restarted with its session and log"
bases=(arch-sdboot)
diagnosis='initramfs|initrd'
outcome=repaired
owner=ok
kill_agent_at='DIAGNOSIS'
