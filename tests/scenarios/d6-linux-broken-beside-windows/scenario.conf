# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# D6: A1's interrupted kernel update on a machine that also has Windows, on a
# disk of its own with its own ESP: Linux no longer boots, Windows still
# does. The repair is A1's, on the Linux ESP only; Windows' disk stays as it
# was, byte for byte.
description="Kernel update cut off (A1) beside Windows on its own ESP"
bases=(eos-sdboot)
with=win-standin
with_esp=own
diagnosis='interrupt|incomplete|cut off|aborted|power|half|unfinished|crash'
outcome=repaired
owner=ok
