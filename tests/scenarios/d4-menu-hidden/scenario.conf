# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# D4: Linux and Windows share one ESP, and systemd-boot, which lists Windows
# by itself (auto-windows), hides its menu: loader.conf says timeout 0, as
# the workstation's does. Both systems boot through their firmware entries, but the
# owner, who starts the machine and waits, only ever gets Linux. The repair
# shows the menu again (a timeout in loader.conf or bootctl set-timeout) and
# keeps Windows in it.
description="Only Linux appears: systemd-boot's menu hidden (timeout 0)"
bases=(eos-sdboot)
with=win-standin
with_esp=shared
diagnosis='timeout|menu|hidden|loader\.conf'
outcome=repaired
owner=ok
owner_says="I cannot get to Windows any more: the computer goes straight into Linux and never shows a menu to choose."
check() {  # systemd-boot shows its menu, with Windows in it
    local root=$1 conf t var
    conf=$root$BASE_ESP/loader/loader.conf
    t=$(awk '$1 == "timeout" {v = $2} END {print v}' "$conf" 2>/dev/null)
    # bootctl set-timeout writes LoaderConfigTimeout, which wins over loader.conf.
    if var=$(efi_query "$BENCH_VARS" string 4a67b082-0a4c-41cf-b6c7-440b29bb8c4f LoaderConfigTimeout); then t=$var; fi
    if [[ ! ( $t =~ ^[0-9]+$ && $t -ge 1 ) && $t != menu-force ]]; then echo "the menu stays hidden: timeout ${t:-unset}"; return 1; fi
    if grep -Eq '^[[:space:]]*(auto-windows|auto-entries)[[:space:]]+(0|no|false|off)' "$conf" 2>/dev/null; then
        echo "loader.conf hides Windows: $(grep -E '^[[:space:]]*auto-' "$conf" | tr '\n' ' ')"; return 1
    fi
    echo "systemd-boot shows its menu (timeout $t), Windows auto-detected"
}
