# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# B8: Debian and Arch on one machine, each on a disk and an ESP of its own.
# Only Debian is broken, by A1's kernel update cut off in its initramfs
# build; Arch still boots. The repair is A1's, on Debian's disk only: Arch's
# disk stays as it was, byte for byte (the bystander oracle), its firmware
# entry is the one it had, and it still boots through that entry.
description="Debian's kernel update cut off (A1) beside a healthy Arch on its own disk"
bases=(debian-grub)
with=arch-sdboot
with_esp=own
diagnosis='interrupt|incomplete|cut off|aborted|power|half|unfinished|crash'
outcome=repaired
owner=ok
owner_says="Debian no longer starts on this computer. Arch, on the other disk, still does."
check() {  # Arch's firmware entry as it was
    local disks=$3 now
    now=$(efi_query "$BENCH_VARS" entries | awk -F'\t' -v e="$(cut -f1 "$disks/arch-sdboot.entry")" '$1 == e')
    [[ $now == "$(< "$disks/arch-sdboot.entry")" ]] \
        || { echo "Arch's entry changed: was '$(tr '\t' ' ' < "$disks/arch-sdboot.entry")', now '${now//$'\t'/ }'"; return 1; }
    echo "Arch's entry unchanged: $(tr '\t' ' ' < "$disks/arch-sdboot.entry")"
}
