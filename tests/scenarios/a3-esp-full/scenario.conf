# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A3: the ESP is full of boot files for kernels removed long ago, so the last
# kernel update ran out of space writing its initramfs: the newest entry, the
# one systemd-boot picks, has a truncated initramfs and the kernel panics.
# Only regenerable boot files may go without the owner's OK (stale kernels and
# their entries); the owner's own file on the ESP must stay.
# On NixOS (the home server's shape, no configurationLimit) the new generation's
# switch ran out of space on an ESP full of old generations' boot files: the
# machine still boots the old one, but the owner's update is not installed
# until old generations, the owner's to delete, are pruned.
description="ESP full: the newest initramfs, or the new NixOS generation, does not fit"
bases=(eos-sdboot nixos-sdboot)
diagnosis='full|space|stale|old kernel|ENOSPC|truncat'
outcome=repaired
owner=ok
expect() {
    protect=("${BASE_ESP#/}/owner")   # ESP files the repair must keep, beside home/bench and srv/bench
    [[ $BASE_INITRAMFS == nixos ]] || unset -f check
}
check() {  # NixOS: the new generation installed and the default, the one before it kept
    local root=$1 next prev
    next=$(awk '$1 == "a3-next" {print $2}' "$root/var/lib/bench/generations")
    [[ $(root_path "$root" /nix/var/nix/profiles/system) == "$(root_path "$root" "$next")" ]] \
        || { echo "the system profile is not the new generation (a3-next)"; return 1; }
    prev=$(( $(nixos_generation "$root") - 1 ))
    [[ -L $root/nix/var/nix/profiles/system-$prev-link ]] || { echo "generation $prev, the last that booted, was deleted"; return 1; }
    nixos_boot_check "$root"
}
