# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A6: an update-grub (grub2-mkconfig on Fedora) cut off while it wrote the
# configuration left /boot's grub.cfg empty, and the small grub.cfg on the ESP
# that finds it searches for a root UUID no filesystem has (mistyped by hand
# while the owner tried to fix it). GRUB stops at its prompt. The repair finds
# the root's UUID, corrects the ESP's stub (or reinstalls GRUB) and
# regenerates grub.cfg in a chroot.
description="GRUB's configuration empty and its ESP stub naming a wrong root UUID"
bases=(debian-grub fedora-grub)
diagnosis='grub\.cfg|uuid'
outcome=repaired
owner=ok
