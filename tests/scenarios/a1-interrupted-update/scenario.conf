# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A1: a kernel update cut off while the package hook (mkinitcpio, dracut
# through kernel-install, or Debian's update-initramfs) was writing the boot
# files (a power cut or a closed terminal). With systemd-boot the kernel on
# the ESP is 0 bytes, the initramfs images are gone, and pacman's lock is left
# behind; with GRUB the initramfs in /boot is missing, and on Debian the
# kernel package is left half-configured.
description="Kernel update cut off while its package hook wrote the boot files"
bases=(arch-sdboot eos-sdboot debian-grub fedora-grub)
# The DIAGNOSIS line must name the cause (extended regex, case-insensitive).
diagnosis='interrupt|incomplete|cut off|aborted|power|half|unfinished|crash'
outcome=repaired   # the expected HANDBACK outcome
owner=ok           # the stand-in owner's answer to every question
