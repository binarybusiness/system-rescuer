# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A4: the disk moved from an AHCI controller to NVMe (a new mainboard, or the
# system cloned onto an NVMe drive). The initramfs was last built by
# mkinitcpio's autodetect hook on the old machine and carries no NVMe driver,
# so the kernel never finds the root and the boot ends in the emergency shell.
# The repair rebuilds the initramfs on this machine.
description="Disk moved from AHCI to NVMe; the initramfs lacks the NVMe driver"
bases=(arch-sdboot)
diagnosis='nvme|driver|controller|module|ahci|autodetect'
outcome=repaired
owner=ok
disk_bus=nvme
