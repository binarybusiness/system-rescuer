# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A1-offline: a kernel reinstall cut off while pacman wrote the linux
# package's files (tests/scenarios/a1-offline/break.sh), on a machine whose
# network reaches the model API and no package mirror. Rebuilding the boot
# files is not enough, since the package's own files are broken: the agent
# must install linux again, from the stick's offline repository.
description="Kernel package half written, and no mirror reachable"
bases=(arch-sdboot)
diagnosis='interrupt|incomplete|cut off|aborted|power|half|unfinished|crash|truncat|missing'
outcome=repaired
owner=ok
offline_repos=1
check() {  # linux installed again, from the stick's repository, whole
    local root=$1 log=$1/var/log/pacman.log k
    if ! awk '/\[PACMAN\] Running .*rescue-repo/ {f = 1} f && /\[ALPM\] (reinstalled|upgraded|installed) linux / {ok = 1} END {exit !ok}' "$log"; then
        echo "pacman.log shows no install of linux from the stick's repository: $(grep -a 'PACMAN\] Running' "$log" | tail -n 3 | tr '\n' ' ')"
        return 1
    fi
    k=$(basename "$(find "$root/usr/lib/modules" -mindepth 2 -maxdepth 2 -name vmlinuz -size +1M -printf '%h\n' | sort -V | tail -n 1)")
    [[ -n $k && $k != . ]] || { echo "no whole kernel image under /usr/lib/modules"; return 1; }
    echo "linux installed from the stick's repository: $(grep -a -E '\[ALPM\] (reinstalled|upgraded|installed) linux ' "$log" | tail -n 1 | cut -d' ' -f3-), kernel $k whole"
}
