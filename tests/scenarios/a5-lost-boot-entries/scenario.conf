# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A5: the firmware forgot its boot entries (a mainboard swap, a CMOS reset or a
# firmware update), and the ESP has no fallback loader \EFI\BOOT\BOOTX64.EFI
# to fall back on: the firmware finds nothing to boot. The repair reinstalls
# the boot loader, which writes both the loader and its firmware entry.
description="Firmware boot entries gone and no fallback loader on the ESP"
bases=(arch-sdboot)
diagnosis='entr|nvram|fallback|bootx64|firmware|efibootmgr'
outcome=repaired
owner=ok
fresh_vars=1
