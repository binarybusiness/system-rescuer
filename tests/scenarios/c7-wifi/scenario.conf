# shellcheck shell=bash disable=SC2034,SC2154  # read by tests/scenario.sh, which sets results, bench_tmp and wifi_pass
# C7: Wi-Fi is the only way out. It runs on C6's test-only ISO, whose wired
# NICs never ask for an address, and the bench gives the rescue system a
# simulated Wi-Fi network with its wired NIC behind it (wifi=ap,
# tests/bench/wifi-ap.sh):
#
#   sudo ./build.sh --out-dir out/test-no-dhcp --overlay tests/bench/no-dhcp-overlay
#
# tty1 must show the network menu; the stand-in owner chooses Wi-Fi, picks
# rescue-bench from the list and types its passphrase at iwctl's own prompt,
# and the agent must then start by itself and finish the rescue: the deleted
# initramfs rebuilt. tty1 is kept as typed, before Enter, and again once the
# network is up: the passphrase line must show nothing typed, no six characters of the
# passphrase may appear on it, and the secrets oracle checks the whole record.
description="Wi-Fi only: the owner joins a WPA2 network from tty1's menu, and the agent starts"
bases=(arch-sdboot)
diagnosis='initramfs|initrd'
outcome=repaired
owner=ok
net=nodhcp
iso_dir=test-no-dhcp
wifi=ap
tty1_shows='DeepSeek|Questions'
owner_network() { owner_wifi "$1"; }  # as the owner at tty1: the menu's Wi-Fi (tests/bench/rescue.sh)
