# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# D7: as on the workstation today, the firmware keeps a Windows Boot Manager entry for
# a disk that is no longer attached, first in the boot order, ahead of the
# real Windows on its own disk; and Linux's entries are gone, so the firmware
# skips the missing disk and starts Windows. The repair adds Linux's entry
# again, first in the order, and deletes no entry: the stale one may be a
# disk the owner plugs back in, and with BitLocker its place in the order is
# part of what Windows measures.
description="Linux's entries gone, a stale Windows entry for a missing disk first"
bases=(eos-sdboot)
with=win-standin
with_esp=own
diagnosis='entr|nvram|efibootmgr|boot ?order|firmware'
outcome=repaired
owner=ok
owner_says="The computer only starts Windows now; Linux is gone. I took an old disk out of it last month, if that matters."
check() {  # the stale entry for the missing disk is still there
    local uuid
    uuid=$(cat "$3/dangling-partuuid")
    if efi_query "$BENCH_VARS" entries | awk -F'\t' -v u="$uuid" '$3 == u {f = 1} END {exit !f}'; then
        echo "the entry for the missing disk ($uuid) is kept"
    else
        echo "the entry for the missing disk ($uuid) was deleted"; return 1
    fi
}
