# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# D5: Debian was installed beside Windows, which came first and keeps its boot
# files on the shared ESP. GRUB's menu offers only Debian: os-prober is
# installed, but GRUB runs it only when GRUB_DISABLE_OS_PROBER=false (off by
# default since GRUB 2.06), so grub.cfg was generated without Windows. Both
# firmware entries are intact. The repair enables os-prober and regenerates
# grub.cfg in a chroot, so the menu offers Windows Boot Manager on the ESP.
description="GRUB's menu offers only Linux: os-prober disabled beside Windows"
bases=(debian-grub)
with=win-standin
with_esp=shared
diagnosis='os-prober|os_prober'
outcome=repaired
owner=ok
owner_says="Since I installed Debian next to Windows, the boot menu only offers Debian. Windows is missing from it."
check() {  # grub.cfg chainloads Windows Boot Manager from the ESP, and still offers Debian
    local root=$1 cfg=$1/boot/grub/grub.cfg esp uuid found
    esp=$(findmnt -no SOURCE "$root$BASE_ESP") || { echo "no ESP mounted at $BASE_ESP"; return 1; }
    uuid=$(blkid -s UUID -o value "$esp") || { echo "cannot read the ESP's UUID"; return 1; }
    found=$(awk -v u="$uuid" '
        /^[[:space:]]*menuentry / {title = $0; search = ""; next}
        /search .*--set=root/ {search = $0}
        tolower($0) ~ /chainloader +\/efi\/microsoft\/boot\/bootmgfw\.efi/ && index(search, u) {print title; exit}
    ' "$cfg")
    [[ -n $found ]] || { echo "grub.cfg has no entry that chainloads /EFI/Microsoft/Boot/bootmgfw.efi from the ESP ($uuid)"; return 1; }
    grep -q "^menuentry 'Debian GNU/Linux'" "$cfg" || { echo "grub.cfg no longer offers Debian"; return 1; }
    echo "grub.cfg offers Debian and $(sed -E "s/^[[:space:]]*menuentry '([^']*)'.*/\1/" <<< "$found")"
}
