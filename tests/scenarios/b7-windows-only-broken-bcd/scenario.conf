# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# B7: a machine with Windows only (and a second disk, still blank), whose BCD
# store on Windows' own ESP was cut to 0 bytes: Windows Boot Manager stops
# with 0xc000000f. Rebuilding the BCD is Windows' own repair (bcdboot from
# its installation media), which the brief forbids here, and there is no
# Linux to repair: the agent diagnoses read-only, writes nothing to any disk,
# and hands back unrepairable with Windows' own steps for the owner. The
# blank disk stays blank (unchanged, byte for byte) and Windows' disk too
# (the bystander oracle).
description="Windows only, its BCD store empty: diagnose and write nothing"
bases=(debian-grub)
with=win-standin
with_esp=own
diagnosis='BCD'
outcome=unrepairable
owner=ok
owner_says="This PC only has Windows. It now stops at a blue screen: Your PC needs to be repaired. The Boot Configuration Data file is missing some required information. Error code: 0xc000000f"
boots=0 unchanged=disk log_on_disk=0
