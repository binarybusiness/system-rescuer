# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# D1: Linux and Windows share one ESP (Windows came first, as on the workstation), and
# a Windows update put Windows Boot Manager first in the boot order and
# dropped Linux's firmware entries: the machine starts Windows straight away.
# Linux's files on the ESP are intact. The repair adds Linux's entry again,
# first in the order, and leaves Windows' entry and files alone. With a real
# Windows (--with win11-eval, BitLocker on) Windows has an ESP of its own.
description="Only Windows starts: Linux's firmware entries gone, Windows first"
bases=(eos-sdboot)
with=win-standin
with_esp=shared
diagnosis='entr|nvram|efibootmgr|boot ?order|firmware'
outcome=repaired
owner=ok
owner_says="After a Windows update the computer starts straight into Windows. Linux no longer comes up at all."
expect() {  # shellcheck disable=SC2154  # with is set by tests/scenario.sh
    # A real Windows (win11-eval) was installed on its own disk, with its own ESP.
    [[ $with != win11-eval ]] || with_esp=own
}
