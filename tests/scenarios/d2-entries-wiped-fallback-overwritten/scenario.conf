# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# D2: Linux and Windows share one ESP. A firmware update wiped every boot
# entry, and Windows had copied its boot manager over the fallback loader
# \EFI\BOOT\BOOTX64.EFI, so the firmware, with nothing else to start, starts
# Windows through the fallback path. The repair adds both systems' entries
# again, Linux first, and leaves Windows' own files alone.
description="Firmware entries wiped and Windows' loader at the fallback path"
bases=(eos-sdboot)
with=win-standin
with_esp=shared
diagnosis='entr|nvram|efibootmgr|fallback|bootx64|firmware'
outcome=repaired
owner=ok
owner_says="After a firmware (BIOS) update the computer only starts Windows, and Linux is gone from the boot menu."
