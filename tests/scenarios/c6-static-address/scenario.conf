# shellcheck shell=bash disable=SC2034,SC2154  # read by tests/scenario.sh, which sets results
# C6: no DHCP answer. It runs on a test-only ISO whose wired NICs never ask
# for an address, with the bench's SSH on a NIC of its own:
#
#   sudo ./build.sh --out-dir out/test-no-dhcp --overlay tests/bench/no-dhcp-overlay
#
# After 60 s without an address tty1 must show the network menu; the stand-in
# owner chooses a static address and types qemu's user network into it
# (10.0.2.15/24, gateway 10.0.2.2, DNS 10.0.2.3), and the agent must then
# start by itself and finish the rescue: the deleted initramfs rebuilt.
description="No DHCP: the owner sets a static address from tty1's menu, and the agent starts"
bases=(arch-sdboot)
diagnosis='initramfs|initrd'
outcome=repaired
owner=ok
net=nodhcp
iso_dir=test-no-dhcp
tty1_shows='DeepSeek|Questions'
owner_network() {  # as the owner at tty1: the menu's static address
    local p=$1 field value
    wait_for "$results/rescue-serial.log" 300 rescue_screen "$p" 'NO NETWORK: no address came from the network' \
        || { echo "tty1 showed no network menu within 300 s"; return 1; }
    rescue_tmux "$p" send-keys -t rescue 2 Enter || return 1
    for field in 'Address with prefix length' 'Gateway \(the router\)' 'DNS server'; do
        wait_for "$results/rescue-serial.log" 30 rescue_screen "$p" "$field" || { echo "the menu never asked: $field"; return 1; }
        case $field in
            Address*) value=10.0.2.15/24 ;;
            Gateway*) value=10.0.2.2 ;;
            *) value=10.0.2.3 ;;
        esac
        rescue_tmux "$p" send-keys -t rescue -l "$value" || return 1
        rescue_tmux "$p" send-keys -t rescue Enter || return 1
    done
    wait_for "$results/rescue-serial.log" 60 rescue_screen "$p" 'rescue-network: the network is up' \
        || { echo "the menu took the address, but no route came: $(rescue_ssh "$p" 'ip -brief address; ip route' 2>&1 | tr '\n' ' ')"; return 1; }
    echo "tty1 showed the network menu; a static 10.0.2.15/24 via 10.0.2.2 set from it brought the network up"
}
