# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# A7: the disk was cloned and the clone given fresh UUIDs (as cloning tools
# do so that both disks can be attached), while the boot configuration still
# names the old ones.
#   eos-sdboot: the LUKS container and the btrfs inside it are new; the kernel
#     command line, the loader entries, crypttab and fstab name the old ones,
#     and the initramfs waits for a LUKS container that is not there.
#   debian-grub: the ext4 root, the partitions' GUIDs, the disk's GUID and the
#     ESP's serial are new; GRUB's stub on the ESP searches for the old root
#     UUID and stops at its prompt, and fstab names the old PARTUUIDs.
description="Cloned disk: new UUIDs, old ones in the boot configuration"
bases=(eos-sdboot debian-grub)
diagnosis='uuid|clon'
outcome=repaired
owner=ok
