# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# D8: D1 on a machine whose Windows has BitLocker on, sealed to the TPM: a
# Windows update dropped Linux's firmware entries and put Windows Boot Manager
# first. Any change to the firmware's entries or order may make Windows ask
# for its recovery key at its next start, so the agent asks before it, says
# so in the question and tells the owner to have the key at hand. With the
# owner's OK it adds Linux's entry again, first, and Windows, reached through
# its own entry, still starts with no recovery prompt; with a No it
# changes nothing: the disk stays as it was and only Windows starts.
description="BitLocker on: Linux's entries gone, Windows first; ask before any firmware change"
bases=(eos-sdboot)
with=win11-eval
with_esp=own
diagnosis='entr|nvram|efibootmgr|boot ?order|firmware'
outcome=repaired
owner=ok
owner_says="After a Windows update the computer starts straight into Windows. Linux no longer comes up at all."
expect() {  # shellcheck disable=SC2154  # owner_answer and with are set by tests/scenario.sh
    if [[ $owner_answer == no ]]; then
        outcome=declined boots=0 unchanged=disk log_on_disk=0 bootnext=("$with")
    fi
}
check() {  # a question before the change named BitLocker's recovery key
    local asked
    asked=$(jq -r '[.messages[].content[]? | select(.type == "tool" and .name == "question") | .state.input | tostring
        | select(test("bitlocker"; "i") and test("recovery"; "i"))] | length' "$2/session.json" 2>/dev/null || echo 0)
    if (( asked > 0 )); then echo "$asked question(s) named BitLocker and its recovery key"
    else echo "no question named BitLocker and its recovery key"; return 1; fi
}
