# shellcheck shell=bash disable=SC2034  # read by tests/scenario.sh
# D3: Windows on a disk of its own with its own ESP, and its firmware entry
# gone (a firmware reset, after which bootctl's next update wrote Linux's
# entry again, and nothing Windows'): Linux starts as before, Windows not at
# all. The
# repair adds Windows Boot Manager's entry again, after Linux's, and changes
# nothing on Windows' disk.
description="Only Linux starts: Windows' firmware entry gone, its ESP on its own disk"
bases=(eos-sdboot)
with=win-standin
with_esp=own
diagnosis='entr|nvram|efibootmgr|boot ?order|firmware'
outcome=repaired
owner=ok
owner_says="Windows no longer starts: the computer always goes straight to Linux, and the boot menu (F12) shows no Windows."
