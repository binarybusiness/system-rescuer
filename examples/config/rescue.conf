# system-rescuer configuration: copy this directory to ~/.config/system-rescuer/
# (or pass it with `build.sh --config <dir>`), then edit it. Values are the
# rest of the line, taken literally; ~/ is your home, and a relative path is
# relative to this directory. The format is in lib/rescue-config.sh.

# Where build.sh reads the API key, unless it is piped in with --key-stdin.
# Either a file, read as you (not root):
#key_file=~/.config/system-rescuer/api-key
# or a command that prints it, run as you:
#key_command=pass show rescue/api-key

# The private key whose public half is in authorized_keys; tests/qemu-boot.sh
# and the scenario bench log in to the stick with it.
#ssh_identity=~/.ssh/id_ed25519

# The model API the repair agent talks to, any OpenAI-compatible provider.
# Every name is optional; the values below are the defaults (DeepSeek V4.1
# Flash), so an unchanged configuration builds the same image. build.sh checks
# them and writes them into the image once, as /etc/rescue/provider.conf.
# The API key is the one from key_file, key_command or --key-stdin above.
#
# The base URL, https only (an http:// URL is refused), with its /v1:
#provider_url=https://api.deepseek.com/v1
# The model id the API takes, and the name OpenCode shows:
#provider_model=deepseek-flash
#provider_model_name=DeepSeek V4.1 Flash
# Token limits:
#provider_context=256000
#provider_output=32768
# Cost in US$ per million tokens:
#provider_cost_input=0.30
#provider_cost_output=1.20
#provider_cost_cache_read=0.006
# A PEM file of a CA the proxy trusts instead of the system bundle, for a
# self-hosted provider; TLS verification stays on. Keep it in this directory
# and name it relative to it, since a container build sees only this
# directory:
#provider_ca_file=provider-ca.pem
# build.sh refuses a key that does not start with this (empty: no check):
#provider_key_prefix=sk-
