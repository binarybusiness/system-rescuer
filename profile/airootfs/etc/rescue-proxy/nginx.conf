# The model API proxy (rescue-proxy.service): OpenCode talks plain HTTP to
# 127.0.0.1:8484, and this adds the key on the way to the configured model
# API (/etc/rescue/provider.conf), so the key never enters OpenCode, whose
# commands could print it. The upstream, its TLS verification and its Host
# header come from /run/rescue-proxy/upstream.conf, which rescue-proxy-conf
# writes at start from that file. The Authorization header comes from a root-only file that
# rescue-proxy-conf writes at start beside the key, in /run/.rescue-key (a
# tmpfs of its own, which the agent's mount namespace unmounts).
# A request whose upstream sends nothing for 180 s ends with a 504, which
# OpenCode retries; each request is logged to the journal with its status
# and duration, never its headers.
worker_processes 1;
error_log stderr warn;
pid /run/rescue-proxy/nginx.pid;

events {
    worker_connections 64;
}

http {
    log_format rescue '$time_iso8601 $request_method $uri $status $request_time s, $bytes_sent bytes';
    # Through syslog, so the journal files it under this unit (nginx cannot
    # open /dev/stderr when it is the journal's socket).
    access_log syslog:server=unix:/dev/log,tag=rescue_proxy,nohostname rescue;
    server_tokens off;
    client_max_body_size 64m;
    client_body_buffer_size 64m;

    server {
        listen 127.0.0.1:8484;

        location /v1/ {
            include /run/rescue-proxy/upstream.conf;
            include /run/.rescue-key/auth.conf;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location / {
            return 404;
        }
    }
}
